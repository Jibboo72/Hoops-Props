name: Tonight

on:
  schedule:
    - cron: 0 16 * * *
    - cron: 0 19 * * *
    - cron: 0 22 * * *
  workflow_dispatch:
    inputs:
      date:
        description: Date as YYYY-MM-DD, blank for today
        required: false

permissions:
  contents: write

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Skip if today's board is already up
        id: check
        run: |
          today=$(TZ=America/New_York date +%F)
          if [ "${{ github.event_name }}" = schedule ] && grep -q "\"date\": \"$today\"" docs/data/board.json; then
            echo "Board for $today already built, skipping so no odds credits are spent"
            echo skip=1 >> $GITHUB_OUTPUT
          fi
      - if: ${{ steps.check.outputs.skip != 1 }}
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - if: ${{ steps.check.outputs.skip != 1 }}
        run: pip install requests pandas numpy scipy
      - if: ${{ steps.check.outputs.skip != 1 }}
        run: python board.py ${{ inputs.date }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - if: ${{ steps.check.outputs.skip != 1 }}
        run: python sim.py
      - if: ${{ steps.check.outputs.skip != 1 }}
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/data/board.json docs/data/sim_log.json docs/data/calib docs/data/credits.json
          git diff --cached --quiet || git commit -m tonight-board
          git pull --rebase
          git push
