
name: Backtest

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-download all NBA data"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests pandas numpy scipy

      - name: Fetch data and run backtest
        run: |
          if [ "${{ inputs.refresh }}" = "true" ]; then
            python nba_pipeline.py --refresh
          else
            python nba_pipeline.py
          fi

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Backtest results"
          git push
