name: Probe

# Run this first. It checks that GitHub's servers can reach ESPN (the data source) and that the
# parser reads a real game correctly. Look for "PROBE OK" at the end of the log.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: pip install requests pandas numpy scipy
      - name: Read a real 2024-25 game and a real 2025-26 game from ESPN
        run: |
          python - <<'PY'
          import nba_data as d
          for day, season in (("2024-10-22", "20242025"), ("2025-10-21", "20252026")):
              games = d.fetch_schedule(day)
              print(day, "->", len(games), "games on the scoreboard")
              final = [g for g in games if g["status"] == 3 and g["type"] == 2]
              assert final, f"no finished regular-season games found for {day}"
              rows, ok = d.parse_boxscore(d.get_json(d.BOX_URL.format(gid=final[0]["id"])), season)
              print("  game", final[0]["away"], "@", final[0]["home"], "final:", ok, "players:", len(rows))
              assert ok and len(rows) >= 14, "boxscore did not parse"
              top = max(rows, key=lambda r: r["min"])
              print("  most minutes:", {k: top[k] for k in ("name", "pos", "team", "min", "fg3m", "fg3a", "reb", "date")})
          print("PROBE OK")
          PY
      - name: What does ESPN say before tip-off? (injuries, starters, lineups)
        run: |
          python - <<'PY'
          import nba_data as d, json
          games = d.fetch_schedule()
          print("games today:", [(g["away"], g["home"], g["status"]) for g in games])
          if games:
              js = d.get_json(d.BOX_URL.format(gid=games[0]["id"]))
              print("top-level keys:", sorted(js))
              inj = js.get("injuries") or []
              print("injuries blocks:", len(inj))
              for blk in inj[:2]:
                  print(" team:", (blk.get("team") or {}).get("abbreviation"), "n =", len(blk.get("injuries", [])))
                  for i in blk.get("injuries", [])[:4]:
                      print("   ", (i.get("athlete") or {}).get("displayName"), "|", i.get("status"), "|", (i.get("details") or {}).get("type") or i.get("type"))
              print("rosters key:", "rosters" in js, "| boxscore players blocks:", len((js.get("boxscore") or {}).get("players", [])))
              for k in ("rosters", "leaders", "predictor", "againstTheSpread", "odds"):
                  print(k, "->", type(js.get(k)).__name__, (str(js.get(k))[:160] if js.get(k) else ""))
          PY

