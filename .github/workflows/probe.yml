name: Probe

# Run this FIRST. It checks which NBA data feeds GitHub's servers can actually reach.
# Look at each "status" line: 200 means reachable, 403/404 means blocked or missing.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check NBA feeds
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          check() {
            code=$(curl -s -m 30 -o /tmp/body -w "%{http_code}" -A "$UA" -H "Referer: https://www.nba.com/" -H "Origin: https://www.nba.com" "$1")
            echo "status $code  $1"
            head -c 150 /tmp/body | tr '\n' ' '; echo; echo
          }
          B=https://cdn.nba.com/static/json/liveData/boxscore
          check "https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json"
          check "$B/boxscore_0022400001.json"
          check "$B/boxscore_0022400500.json"
          check "$B/boxscore_0022500001.json"
          check "$B/boxscore_0022500400.json"
          check "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json"
          check "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20241022"
          check "https://stats.nba.com/stats/boxscoretraditionalv3?GameID=0022400001"
