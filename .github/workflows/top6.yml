name: Top 6 replay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  top6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy scipy
      - run: python sim_top6.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Top 6 replay"
          git pull --rebase -q
          git push
